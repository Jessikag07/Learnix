<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance - Learnix</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f9;margin:0;padding:0;}
.container{max-width:700px;margin:50px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
h1{text-align:center;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ccc;padding:10px;text-align:center;}
th{background:#007bff;color:#fff;}
.pass{color:green;font-weight:bold;}
.fail{color:red;font-weight:bold;}
a{display:block;text-align:center;margin-top:20px;padding:10px;background:#28a745;color:#fff;text-decoration:none;border-radius:5px;}
</style>
</head>
<body>
<div class="container">
<h1>Performance Report</h1>
<table>
<tr>
<th>Quiz</th>
<th>User</th>
<th>Score</th>
<th>Status</th>
</tr>
<tbody id="performanceTable"></tbody>
</table>
<a href="dashboard.html">Back to Dashboard</a>
</div>

<script>
let user = JSON.parse(localStorage.getItem('currentUser'));
if(!user){ window.location.href='registration.html'; }

const records = JSON.parse(localStorage.getItem('quizRecords')||'[]');
const tableBody = document.getElementById('performanceTable');

records.filter(r=>r.user === user.email).forEach(r=>{
    const tr = document.createElement('tr');
    const status = r.score < 33 ? 'Fail' : 'Pass';
    tr.innerHTML = `
        <td>${r.quiz}</td>
        <td>${r.user}</td>
        <td>${r.score}%</td>
        <td class="${status==='Pass'?'pass':'fail'}">${status}</td>
    `;
    tableBody.appendChild(tr);
});
</script>
</body>
</html>
