<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Learnix</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f9;margin:0;padding:0;}
.container{max-width:600px;margin:50px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
h1,h2{text-align:center;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ccc;padding:8px;text-align:center;}
.pass{background:#c8e6c9;color:#2e7d32;font-weight:bold;}
.fail{background:#ffcdd2;color:#c62828;font-weight:bold;}
a.btn{display:block;text-align:center;padding:10px;margin-top:15px;background:#28a745;color:#fff;text-decoration:none;border-radius:5px;}
a.logout{background:#dc3545;}
</style>
</head>
<body>
<div class="container">
<h1>Dashboard</h1>
<div id="profile"></div>

<h2>Previous Records</h2>
<table>
<thead><tr><th>Quiz</th><th>Score</th><th>Status</th></tr></thead>
<tbody id="recordsTable"></tbody>
</table>

<a href="studytools.html" class="btn">Study Tools</a>
<a href="registration.html" class="btn logout">Logout</a>
</div>

<script>
let user=JSON.parse(localStorage.getItem('currentUser'));
if(!user){window.location.href='registration.html';}
document.getElementById('profile').innerHTML=`
<p><strong>Name:</strong> ${user.name}</p>
<p><strong>Email:</strong> ${user.email}</p>
<p><strong>Standard:</strong> ${user.standard}</p>
<p><strong>School:</strong> ${user.school}</p>
<p><strong>City:</strong> ${user.city}</p>`;

let records=JSON.parse(localStorage.getItem('quizRecords')||'[]');
let tbody=document.getElementById('recordsTable');
records.filter(r=>r.user===user.email).forEach(r=>{
  let tr=document.createElement('tr');
  tr.innerHTML=`<td>${r.quiz}</td><td>${r.score}%</td><td class="${r.score<33?'fail':'pass'}">${r.score<33?'Fail':'Pass'}</td>`;
  tbody.appendChild(tr);
});
</script>
</body>
</html>
