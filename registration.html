<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learnix - Registration</title>
<style>
body{font-family:Georgia, 'Times New Roman', Times, serif;background:#f4f4f9;margin:0;padding:0;}
.container{max-width:450px;margin:50px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 0 15px rgba(0,0,0,0.2);}
h1{text-align:center;margin-bottom:20px;}
form{display:flex;flex-direction:column;}
input{padding:10px;margin:5px 0;border-radius:5px;border:1px solid #ccc;}
button{padding:10px;margin:10px 0;border:none;border-radius:5px;background:#007bff;color:#fff;cursor:pointer;}
button:hover{background:#0056b3;}
.toggle{text-align:center;color:#007bff;cursor:pointer;margin-top:10px;}
.toggle:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="container">
<h1>Learnix</h1>

<!-- Sign Up Form -->
<form id="signupForm">
  <h2>Sign Up</h2>
  <input type="text" id="name" placeholder="Full Name" required>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>
  <input type="text" id="standard" placeholder="Class/Standard" required>
  <input type="text" id="school" placeholder="School Name" required>
  <input type="text" id="city" placeholder="City" required>
  <button type="submit">Sign Up</button>
  <p class="toggle">Already a user? <span id="showSignIn">Sign In</span></p>
</form>

<!-- Sign In Form -->
<form id="signinForm" style="display:none;">
  <h2>Sign In</h2>
  <input type="email" id="loginEmail" placeholder="Email" required>
  <input type="password" id="loginPassword" placeholder="Password" required>
  <button type="submit">Sign In</button>
  <p class="toggle">New here? <span id="showSignUp">Sign Up</span></p>
</form>
</div>

<script>
let users = JSON.parse(localStorage.getItem('users')||'[]');

document.getElementById('showSignIn').addEventListener('click',()=>{
  document.getElementById('signupForm').style.display='none';
  document.getElementById('signinForm').style.display='flex';
});
document.getElementById('showSignUp').addEventListener('click',()=>{
  document.getElementById('signinForm').style.display='none';
  document.getElementById('signupForm').style.display='flex';
});

document.getElementById('signupForm').addEventListener('submit', e=>{
  e.preventDefault();
  const user={
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    standard: document.getElementById('standard').value,
    school: document.getElementById('school').value,
    city: document.getElementById('city').value
  };
  if(users.find(u=>u.email===user.email)){
    alert('User already exists! Please Sign In.');
    return;
  }
  users.push(user);
  localStorage.setItem('users',JSON.stringify(users));
  localStorage.setItem('currentUser',JSON.stringify(user));
  window.location.href='dashboard.html';
});

document.getElementById('signinForm').addEventListener('submit', e=>{
  e.preventDefault();
  const email=document.getElementById('loginEmail').value;
  const password=document.getElementById('loginPassword').value;
  const user=users.find(u=>u.email===email && u.password===password);
  if(user){
    localStorage.setItem('currentUser',JSON.stringify(user));
    window.location.href='dashboard.html';
  } else {
    alert('Invalid credentials!');
  }
});
</script>
</body>
</html>
